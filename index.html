<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171411">
  <meta name="description" content="Stanics — способы поддержки разработки.">
  <title>Stanics — Поддержка</title>
  <style>
:root{
  --bg:#171411; --panel:#211c18; --tile:#261f19; --tile-hover:#30251c;
  --line:#5b4532; --line-faint:#40352b; --accent:#c59159;
  --accent-light:#e4b57e; --text:#f2e9df; --muted:#b5a69a;
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;display:flex;flex-direction:column;min-height:100svh;color:var(--text);background:var(--bg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent-light);outline-offset:3px}
.wrap{width:min(1210px,calc(100% - 56px));margin-inline:auto}
.topbar{border-bottom:1px solid var(--line-faint)}
.topbar-inner{display:flex;justify-content:space-between;align-items:center;min-height:91px;gap:16px}
.brand{display:inline-flex;align-items:center;gap:24px;color:#e9d6c4;text-decoration:none;font-size:18px;font-weight:760;letter-spacing:.24em}
.mark{height:42px;width:42px;display:grid;place-items:center;color:var(--accent-light);border:1px solid var(--accent);border-radius:6px;font-size:22px;font-weight:750;letter-spacing:0}
.brand-word{border-left:1px solid #6b5140;padding-left:25px}
.lang{display:flex;gap:2px;padding:3px;border:1px solid #574333;border-radius:7px}
.lang button{background:transparent;border:0;border-radius:4px;cursor:pointer;color:var(--muted);padding:9px 16px;font-size:13px;font-weight:700;line-height:1.15}
.lang button[aria-pressed="true"]{background:#d29a5d;color:#19140f}
.lang button:hover:not([aria-pressed="true"]){background:#3b2d22;color:var(--text)}
main.wrap{flex:1;display:flex;align-items:center;padding:clamp(38px,7vh,100px) 0}
.support{scroll-margin-top:20px;width:100%;display:grid;grid-template-columns:40% minmax(0,60%);align-items:center;min-height:350px;padding:50px 55px 50px 60px;border:1px solid #8b613c;border-radius:13px;background:#211b16}
.intro{padding-right:45px}
h1{margin:0;color:#f1d9c3;font-weight:680;letter-spacing:-.036em;font-size:clamp(32px,3vw,43px);line-height:1.17;max-width:340px}
.subtitle{margin:24px 0 0;font-size:15px;color:var(--muted);line-height:1.7;max-width:320px}
.method-list{border-left:1px solid #45382c;padding-left:36px;display:grid;gap:22px;min-width:0}
.method{display:block;background:var(--tile);border:1px solid #4e3c2c;border-radius:12px;color:var(--text);text-decoration:none;min-width:0;transition:background .15s,border-color .15s}
a.method:hover,details.method:hover{background:var(--tile-hover);border-color:#a36f40}
.method-main{display:flex;align-items:center;gap:23px;padding:18px 20px;min-height:102px;min-width:0}
.symbol{display:grid;place-items:center;flex:0 0 55px;width:55px;height:55px;border:1px solid #a77342;color:#d9a366;background:#292016;border-radius:9px;font-size:29px;font-weight:600;line-height:1}
.method-title{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.method-title strong{font-weight:680;font-size:16px;line-height:1.3;color:#f0e3d5}
.method-title small{font-size:12px;line-height:1.45;color:var(--muted)}
.method-arrow{color:var(--accent);font-size:25px;flex:none;line-height:1}
.footer{border-top:1px solid var(--line-faint);padding:28px 0 35px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:12px;color:#ada093}
.footer-brand{display:flex;align-items:center;gap:18px}
.footer-inner strong{color:#e5d0bc;font-size:12px;letter-spacing:.18em}
.footer-brand span{border-left:1px solid #554233;padding-left:18px}
.footer-inner a{text-decoration:none;color:#c3b4a5}
.footer-inner a:hover{text-decoration:underline;color:var(--accent-light)}
@media(max-width:860px){
  .wrap{width:min(760px,calc(100% - 36px))}
  main.wrap{align-items:flex-start;padding:40px 0 54px}
  .support{grid-template-columns:1fr;min-height:auto;padding:34px;gap:29px}
  .intro{padding-right:0}
  h1{font-size:33px;max-width:none}
  .subtitle{margin-top:12px}
  .method-list{padding-left:0;border-left:0;gap:12px}
}
@media(max-width:540px){
  .wrap{width:calc(100% - 28px)}
  .topbar-inner{min-height:69px}
  .brand{gap:10px;font-size:14px;letter-spacing:.16em}
  .brand-word{padding-left:12px}
  .mark{width:34px;height:34px;font-size:19px}
  .lang button{font-size:12px;padding:7px 11px}
  main.wrap{padding:26px 0 36px}
  .support{padding:25px 17px 17px;gap:23px;border-radius:10px}
  h1{font-size:30px;line-height:1.16}
  .subtitle{margin-top:10px;font-size:13px}
  .method-list{gap:10px}
  .method-main{min-height:77px;padding:13px 12px;gap:12px}
  .symbol{width:39px;height:39px;flex-basis:39px;font-size:22px;border-radius:7px}
  .method-title strong{font-size:14px}
  .method-title small{font-size:11px}
  .method-arrow{font-size:21px}
  .footer{padding:20px 0 25px}
  .footer-inner{flex-wrap:wrap;font-size:11px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.method{transition:none}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#support" aria-label="Stanics"><span class="mark">S</span><span class="brand-word">STANICS</span></a>
      <div class="lang" role="group" aria-label="Language / Язык">
        <button id="ruBtn" type="button" aria-pressed="true">RU</button>
        <button id="enBtn" type="button" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="support" id="support" aria-labelledby="supportTitle">
      <div class="intro"><h1 id="supportTitle" data-i18n="title">Поддержать разработку</h1><p class="subtitle" data-i18n="intro">Выберите удобный способ перевода.</p></div>
      <div class="method-list">
        <a class="method" href="https://pay.cloudtips.ru/p/01a638f4" target="_blank" rel="noopener noreferrer">
          <span class="method-main">
            <span class="symbol" aria-hidden="true">₽</span>
            <span class="method-title"><strong data-i18n="russia">Из России</strong><small data-i18n="russiaDesc">Рубли · СБП · российские карты</small></span>
            <span class="method-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <a class="method" href="https://stanics-shop.fourthwall.com/" target="_blank" rel="noopener noreferrer">
          <span class="method-main">
            <span class="symbol" aria-hidden="true">$</span>
            <span class="method-title"><strong data-i18n="world">Из других стран</strong><small data-i18n="worldDesc">Международные карты · Fourthwall</small></span>
            <span class="method-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <div class="footer-brand"><strong>STANICS</strong><span>© 2026</span></div>
      <a href="https://github.com/StanicsDev" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </footer>
  <script>
  (function(){
    'use strict';
    const words={
      ru:{title:'Поддержать разработку',intro:'Выберите удобный способ перевода.',russia:'Из России',russiaDesc:'Рубли · СБП · российские карты',world:'Из других стран',worldDesc:'Международные карты · Fourthwall'},
      en:{title:'Support development',intro:'Choose a transfer method.',russia:'From Russia',russiaDesc:'RUB · SBP · Russian bank cards',world:'From other countries',worldDesc:'International cards · Fourthwall'}
    };
    const ruBtn=document.getElementById('ruBtn');
    const enBtn=document.getElementById('enBtn');
    let language='ru';
    function setLanguage(lang){
      language=lang==='en'?'en':'ru';
      document.documentElement.lang=language;
      for(const el of document.querySelectorAll('[data-i18n]')){
        const key=el.dataset.i18n;
        if(Object.prototype.hasOwnProperty.call(words[language],key))el.textContent=words[language][key];
      }
      ruBtn.setAttribute('aria-pressed',String(language==='ru'));
      enBtn.setAttribute('aria-pressed',String(language==='en'));
      document.title=language==='ru'?'Stanics — Поддержка':'Stanics — Support';
      document.querySelector('meta[name="description"]').content=language==='ru'?'Stanics — способы поддержки разработки.':'Stanics — ways to support development.';
      try{localStorage.setItem('stanics-site-language',language)}catch(e){}
    }
    ruBtn.addEventListener('click',()=>setLanguage('ru'));
    enBtn.addEventListener('click',()=>setLanguage('en'));
    let initial='ru';
    try{const saved=localStorage.getItem('stanics-site-language');if(saved==='ru'||saved==='en')initial=saved}catch(e){}
    setLanguage(initial);
  })();
  </script>
</body>
</html>
